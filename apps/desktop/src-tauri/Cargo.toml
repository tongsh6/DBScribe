[package]
name = "dbs-desktop"
version.workspace = true
description = "DBScribe 桌面版：跨平台数据库结构文档工具"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# 需要 unique 的 lib 名，避免与 bin 名冲突（Windows）
name = "dbs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
dbs-core = { path = "../../../crates/dbs-core" }
dbs-db = { path = "../../../crates/dbs-db" }
dbs-doc = { path = "../../../crates/dbs-doc" }
keyring = "4.2.0"

# 构建特性统一由根 Cargo.toml 的 [profile.release] 决定
