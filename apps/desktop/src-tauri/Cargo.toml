[package]
name = "dbs-desktop"
version = "0.4.0"
description = "DBScribe 桌面版：跨平台数据库结构文档工具"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tongsh6/DBScribe"

[lib]
# 需要 unique 的 lib 名，避免与 bin 名冲突（Windows）
name = "dbs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
dbs-core = { path = "../../../crates/dbs-core" }
dbs-db = { path = "../../../crates/dbs-db" }
dbs-doc = { path = "../../../crates/dbs-doc" }
keyring = "4.2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
