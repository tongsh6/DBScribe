[package]
name = "dbs-db"
description = "DBScribe 数据库元数据读取层"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dbs-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
mysql_async = { version = "0.35", default-features = false, features = ["default-rustls"] }
tokio-postgres = "0.7.18"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tiberius = { version = "0.13.0", default-features = false, features = ["rustls", "tds73"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
oracle = "0.6.3"
ureq = "3.5.1"
zip = "9.5.0"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
