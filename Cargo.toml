[workspace]
resolver = "2"
members = [
    "crates/dbs-core",
    "crates/dbs-db",
    "crates/dbs-doc",
    "crates/dbs-cli",
]
# 桌面端（Tauri）独立构建，避免主 CI 依赖前端产物
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/tongsh6/DBScribe"
authors = ["DBScribe contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 内部 crate
dbs-core = { path = "crates/dbs-core" }
dbs-db = { path = "crates/dbs-db" }
dbs-doc = { path = "crates/dbs-doc" }

[profile.release]
lto = "thin"
strip = true
