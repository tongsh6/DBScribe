name: Release

# 发布：打 tag 时构建三平台 CLI 与桌面安装包并发布到 GitHub Release。
# 日常 CI 不跑这里，只按需触发。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1) 先构建三平台 CLI 单文件二进制，并创建 Release
  cli:
    name: CLI ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: dbs-linux-x64
          - os: macos-latest
            artifact: dbs-macos-arm64
          - os: windows-latest
            artifact: dbs-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff 需要完整提交历史来生成变更记录
          fetch-depth: 0

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 构建 CLI
        run: cargo build --release -p dbs-cli

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/dbs.exe "dist/${{ matrix.artifact }}"
          else
            cp target/release/dbs "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
          fi
          ls -lh dist/

      - name: 生成 Release Notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: false

  # 2) 桌面安装包：等 CLI 完成（Release 已存在）后追加资产
  desktop:
    name: Desktop ${{ matrix.os }}
    needs: cli
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: 安装 Linux 桌面依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: 构建并上传桌面安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: DBScribe ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
