name: CI

# 核心库与 CLI：只在相关路径变更时触发（改桌面端不跑这里）
on:
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

# 同一分支的新推送取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 核心库与 CLI：三平台 fmt / clippy / test
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 安装 ODBC 运行库（Linux，达梦驱动依赖）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（零告警）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --workspace

  # MongoDB 集成测试：只在 ubuntu 上跑，用 service container 提供实例
  mongodb:
    name: MongoDB 集成测试
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 安装 ODBC 运行库（编译达梦驱动依赖）
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: 集成测试
        env:
          MONGO_URI: mongodb://127.0.0.1:27017
        run: cargo test -p dbs-db --test mongodb -- --ignored --nocapture
