# git-cliff 配置：从 Conventional Commits 生成分类清晰的 Changelog / Release Notes
# 用法：
#   git cliff --latest --strip header -o RELEASE_NOTES.md   # 生成最近一个 tag 的说明
#   git cliff -o CHANGELOG.md                                # 重新生成完整 Changelog

[changelog]
header = """# Changelog

本项目的所有重要变更都记录在此文件，格式参考 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，
版本号遵循 [语义化版本](https://semver.org/lang/zh-CN/)。

"""
body = """
{%- if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}\
## [Unreleased]
{%- endif %}\
{%- for group, commits in commits | group_by(attribute="group") %}

### {{ group }}
{%- for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**：{% endif %}{{ commit.message }}
{%- endfor %}
{%- endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "新功能" },
    { message = "^fix", group = "问题修复" },
    { message = "^perf", group = "性能优化" },
    { message = "^refactor", group = "重构" },
    { message = "^docs", group = "文档" },
    { message = "^style", group = "样式与视觉" },
    { message = "^test", group = "测试" },
    { message = "^ci", group = "构建与 CI" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(init\\)", skip = true },
    { message = "^chore", group = "其他" },
    { message = ".*", group = "其他" },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
